name: build & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # switch to `bun install --frozen-lockfile` once bun.lock is committed
      - run: bun install
      - run: bun run lint
      - run: bun test
      - run: bun run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  # the panes are a fixed-height grid: this is what catches a footer that has
  # slid off the bottom of the window, which a screenshot of the top would not
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bunx playwright install --with-deps chromium
      - run: bun run check:layout

  deploy:
    needs: [build, layout]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
